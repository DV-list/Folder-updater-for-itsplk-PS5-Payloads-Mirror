name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Test and build (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $source = Get-Content main.py -Raw
          if ($source -match 'Mirror v([0-9]+\.[0-9]+\.[0-9]+)') {
            "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            throw "Could not determine application version from main.py"
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --noconsole --optimize 2 --collect-data customtkinter --hidden-import customtkinter --exclude-module unittest --exclude-module test --exclude-module tkinter.test --exclude-module idlelib --exclude-module pydoc_data --exclude-module pytest --exclude-module IPython --exclude-module notebook --name "Folder updater for itsplk PS5 Payloads Mirror v${{ steps.version.outputs.version }}" main.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Folder-updater-Windows-x64-v${{ steps.version.outputs.version }}
          path: dist/Folder updater for itsplk PS5 Payloads Mirror v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30
